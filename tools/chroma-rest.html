<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chroma REST test · Halo</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #15161a; color: #e8e8ea; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  section { background: #1f2026; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  button { font: inherit; padding: .5rem 1rem; margin: .25rem; border: 0; border-radius: 6px; background: #3a3d4a; color: inherit; cursor: pointer; }
  button:hover { background: #4b4f60; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=color] { width: 3.5rem; height: 2.5rem; border: 0; background: none; vertical-align: middle; }
  #status { font-family: monospace; white-space: pre-wrap; color: #9fa3b0; max-height: 12rem; overflow: auto; }
  .zones label { display: inline-block; margin-right: 1rem; text-align: center; font-size: .85rem; }
</style>
</head>
<body>
<h1>Chroma REST test</h1>
<p>Talks to <code>http://localhost:54235/razer/chromasdk</code>, the same API web pages and
games use with Razer Chroma. If Halo is running, the colors show up on the Ally's rings.</p>

<section>
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
</section>

<section>
  <h2>ChromaLink by zone</h2>
  <div class="zones">
    <label><input type="color" value="#ff0000"><br>left A</label>
    <label><input type="color" value="#00ff00"><br>left B</label>
    <label><input type="color" value="#0000ff"><br>right A</label>
    <label><input type="color" value="#ffc000"><br>right B</label>
  </div>
  <button class="session" id="zones">Apply by zone</button>
  <button class="session" id="static">Static (left A's color)</button>
</section>

<section>
  <h2>Animations (driven by the page)</h2>
  <button class="session" id="rainbow">Rainbow</button>
  <button class="session" id="damage">Take damage</button>
  <button class="session" id="keyboard">Keyboard: half red, half blue</button>
  <button class="session" id="stop">Stop animation</button>
  <button class="session" id="off">Off (CHROMA_NONE)</button>
</section>

<section><div id="status"></div></section>

<script>
const BASE = "http://localhost:54235/razer/chromasdk";
let uri = null, heartbeat = null, anim = null;

const $ = id => document.getElementById(id);
const log = msg => { $("status").textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + $("status").textContent; };
// Chroma uses COLORREF: 0x00BBGGRR.
const bgr = hex => { const n = parseInt(hex.slice(1), 16); return ((n & 0xff) << 16) | (n & 0xff00) | (n >> 16); };
const rgb = (r, g, b) => (b << 16) | (g << 8) | r;
const hsv = h => { const f = n => { const k = (n + h / 60) % 6; return Math.round(255 * (1 - Math.max(0, Math.min(k, 4 - k, 1)))); }; return rgb(f(5), f(3), f(1)); };

async function request(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  return r.json();
}

function session(active) {
  $("connect").disabled = active;
  $("disconnect").disabled = !active;
  document.querySelectorAll(".session").forEach(b => b.disabled = !active);
}

async function link(param) {
  const v = await request("PUT", uri + "/chromalink", { effect: "CHROMA_CUSTOM", param });
  if (v.result !== 0) log("chromalink: " + JSON.stringify(v));
}

function stop() { clearInterval(anim); anim = null; }

$("connect").onclick = async () => {
  try {
    const v = await request("POST", BASE, {
      title: "Halo web test",
      description: "Test page for the Chroma REST bridge",
      author: { name: "Halo", contact: "localhost" },
      device_supported: ["keyboard", "chromalink"],
      category: "application",
    });
    uri = v.uri;
    log("session " + v.sessionid + " at " + uri);
    heartbeat = setInterval(() => request("PUT", uri + "/heartbeat").catch(() => {}), 1000);
    session(true);
  } catch (e) {
    log("could not connect: " + e + " (is halo daemon running?)");
  }
};

$("disconnect").onclick = async () => {
  stop();
  clearInterval(heartbeat);
  await request("DELETE", uri).catch(() => {});
  log("session closed: Halo's own color is back");
  uri = null;
  session(false);
};

$("zones").onclick = () => {
  stop();
  const c = [...document.querySelectorAll(".zones input")].map(i => bgr(i.value));
  link([0, ...c]).then(() => log("by zone: " + [...document.querySelectorAll(".zones input")].map(i => i.value).join(" ")));
};

$("static").onclick = async () => {
  stop();
  const color = bgr(document.querySelector(".zones input").value);
  await request("PUT", uri + "/chromalink", { effect: "CHROMA_STATIC", param: { color } });
  log("static");
};

$("rainbow").onclick = () => {
  stop();
  let h = 0;
  anim = setInterval(() => { h = (h + 6) % 360; link([0, hsv(h), hsv(h + 90), hsv(h + 180), hsv(h + 270)]); }, 50);
  log("rainbow at 20 fps");
};

$("damage").onclick = () => {
  stop();
  const orange = rgb(255, 100, 0), red = rgb(255, 0, 0), black = 0;
  const steps = [red, black, red, black, red, orange];
  let i = 0;
  link([0, ...Array(4).fill(steps[i++])]);
  anim = setInterval(() => {
    link([0, ...Array(4).fill(steps[i++])]);
    if (i >= steps.length) stop();
  }, 150);
  log("ouch!");
};

$("keyboard").onclick = async () => {
  stop();
  const rows = Array.from({ length: 6 }, () => Array.from({ length: 22 }, (_, x) => x < 11 ? rgb(255, 0, 0) : rgb(0, 0, 255)));
  await request("PUT", uri + "/keyboard", { effect: "CHROMA_CUSTOM", param: rows });
  log("keyboard 6×22: left red, right blue");
};

$("stop").onclick = () => { stop(); log("animation stopped"); };

$("off").onclick = async () => {
  stop();
  await request("PUT", uri + "/chromalink", { effect: "CHROMA_NONE" });
  await request("PUT", uri + "/keyboard", { effect: "CHROMA_NONE" });
  log("CHROMA_NONE");
};

addEventListener("pagehide", () => { if (uri) fetch(uri, { method: "DELETE", keepalive: true }); });
session(false);
</script>
</body>
</html>
