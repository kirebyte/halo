[workspace]
resolver = "3"
members = ["crates/halo-core", "crates/halo", "crates/halo-gui"]
# The GUI needs Qt 6: it is only built on purpose (cargo build -p halo-gui).
default-members = ["crates/halo-core", "crates/halo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/kirebyte/halo"

[workspace.dependencies]
libc = "0.2"
