[package]
name = "halo-gui"
description = "Kirigami window for the ROG Xbox Ally rings; talks to the daemon over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Needs Qt 6 and Kirigami: not part of the workspace `cargo build` (see default-members).
[dependencies]
halo-core = { path = "../halo-core" }
libc.workspace = true
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
zbus = { version = "6.2.0", default-features = false, features = ["tokio", "proxy"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
