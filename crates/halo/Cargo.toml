[package]
name = "halo"
description = "Lighting for the ROG Xbox Ally joystick rings: CLI and daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
halo-core = { path = "../halo-core" }
libc.workspace = true
memchr = "2.8"
futures-util = { version = "0.3.34", default-features = false }
rustfft = "6.4.1"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "sync", "process", "io-util", "net"] }
zbus = { version = "6.2.0", default-features = false, features = ["tokio", "service", "proxy"] }
